services:
  backend:
    build: .
    container_name: codex-agent-backend
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-deepseek}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-chat}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - BAICHUAN_API_KEY=${BAICHUAN_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - YI_API_KEY=${YI_API_KEY:-}
      - STEPFUN_API_KEY=${STEPFUN_API_KEY:-}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY:-}
    volumes:
      - ./workspace:/app/workspace
      - codex-data:/app/backend/data
    restart: unless-stopped

volumes:
  codex-data: